<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="100%" height="480">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <linearGradient id="videoMock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="overlayGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <style>
      /* Tab overlay stays fully docked on screen; only a subtle float + glow breathe */
      @keyframes overlayBreathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      @keyframes overlayGlowPulse {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; }
      }

      @keyframes reelProgress {
        0% { width: 0; }
        100% { width: 300px; }
      }

      @keyframes guitarVibe {
        0%, 100% { transform: rotate(-12deg) translateY(0); }
        50% { transform: rotate(-10deg) translateY(-4px); }
      }

      .anim-overlay { animation: overlayBreathe 4s ease-in-out infinite; }
      .anim-overlay-border { animation: overlayGlowPulse 4s ease-in-out infinite; }
      .anim-progress { animation: reelProgress 7s linear infinite; }
      .anim-guitar { animation: guitarVibe 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <!-- Phone Shell (Bezel) -->
  <rect x="20" y="10" width="320" height="460" rx="36" fill="url(#phoneBody)" filter="url(#phoneShadow)" stroke="#3f3f46" stroke-width="2" />

  <!-- Phone Screen Display (9:16 Aspect Mock) -->
  <clipPath id="screenClip">
    <rect x="28" y="18" width="304" height="444" rx="28" />
  </clipPath>

  <g clip-path="url(#screenClip)">
    <!-- Video Content Background -->
    <rect x="28" y="18" width="304" height="444" fill="url(#videoMock)" />

    <!-- Stage Lighting Rays -->
    <polygon points="180,18 80,460 280,460" fill="#6366f1" opacity="0.15" />
    <circle cx="180" cy="160" r="90" fill="#818cf8" opacity="0.2" filter="blur(30px)" />

    <!-- Performer Silhouette Playing Guitar -->
    <g transform="translate(45, 10)">
      <g class="anim-guitar">
        <!-- Torso -->
        <path d="M143 122 C143 98 161 86 183 86 C205 86 223 98 223 122 L233 265 C200 288 163 288 133 265 Z" fill="#0b0b10" opacity="0.82" />
        <!-- Neck -->
        <rect x="173" y="88" width="20" height="14" rx="4" fill="#0b0b10" opacity="0.82" />
        <!-- Head -->
        <circle cx="183" cy="70" r="23" fill="#0b0b10" opacity="0.82" />
        <!-- Strumming Arm (reaches down toward sound hole) -->
        <path d="M217 108 C232 138 235 172 225 205" stroke="#0b0b10" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.82" />
        <circle cx="225" cy="205" r="6.5" fill="#0b0b10" opacity="0.82" />
        <!-- Fretting Arm (reaches up along the neck) -->
        <path d="M153 112 C131 118 118 138 119 163" stroke="#0b0b10" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.82" />
        <circle cx="119" cy="163" r="6.5" fill="#0b0b10" opacity="0.82" />

        <!-- Guitar Neck & Headstock -->
        <line x1="80" y1="130" x2="210" y2="240" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
        <polygon points="68,118 84,132 76,140 60,126" fill="#b45309" />
        <!-- Guitar Body -->
        <ellipse cx="205" cy="235" rx="36" ry="46" transform="rotate(35 205 235)" fill="#dc2626" opacity="0.9" />
        <circle cx="195" cy="225" r="12" fill="#18181b" />
      </g>
    </g>

    <!-- Social Media UI Overlay (Reels / TikTok icons) -->
    <g transform="translate(290, 240)">
      <!-- Like Heart -->
      <circle cx="15" cy="0" r="14" fill="#000000" opacity="0.4" />
      <path d="M15 -4 C12 -9, 6 -6, 6 -1 C6 5, 15 10, 15 10 C15 10, 24 5, 24 -1 C24 -6, 18 -9, 15 -4 Z" fill="#ef4444" />
      <text x="15" y="20" font-family="system-ui" font-size="9" fill="#ffffff" text-anchor="middle">24.5K</text>

      <!-- Comment Bubble -->
      <circle cx="15" cy="45" r="14" fill="#000000" opacity="0.4" />
      <circle cx="15" cy="45" r="7" fill="#ffffff" />
      <text x="15" y="66" font-family="system-ui" font-size="9" fill="#ffffff" text-anchor="middle">382</text>

      <!-- Share Arrow -->
      <circle cx="15" cy="90" r="14" fill="#000000" opacity="0.4" />
      <path d="M11 90 L18 83 L18 87 L22 87 C24 87, 24 93, 24 93 C22 91, 20 91, 18 91 L18 95 Z" fill="#ffffff" />
    </g>

    <!-- Bottom Audio / Creator Tag -->
    <g transform="translate(45, 305)">
      <text x="0" y="0" font-family="system-ui" font-size="12" font-weight="bold" fill="#ffffff">@guitarist_pro</text>
      <text x="0" y="14" font-family="system-ui" font-size="10" fill="#cbd5e1">♫ Original Solo • Tab2Share Export</text>
    </g>

    <!-- Tab2Share Animated Transparent Alpha Tab Overlay at Bottom (always docked, fully visible) -->
    <g class="anim-overlay" transform="translate(38, 328)" filter="url(#overlayGlow)">
      <!-- Frosted / Semi-transparent Tab Backdrop -->
      <rect x="0" y="0" width="284" height="110" rx="14" fill="#09090b" opacity="0.9" stroke="#ef4444" stroke-width="1.2" class="anim-overlay-border" />
      
      <!-- Reel Part Badge -->
      <rect x="8" y="8" width="54" height="16" rx="8" fill="#ef4444" />
      <text x="35" y="19" font-family="ui-monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">PART 1/2</text>

      <!-- 4 Staff Strings in Reel Preview -->
      <g transform="translate(16, 38)">
        <line x1="0" y1="0" x2="252" y2="0" stroke="#333338" stroke-width="1.2" />
        <line x1="0" y1="12" x2="252" y2="12" stroke="#333338" stroke-width="1.2" />
        <line x1="0" y1="24" x2="252" y2="24" stroke="#333338" stroke-width="1.2" />
        <line x1="0" y1="36" x2="252" y2="36" stroke="#333338" stroke-width="1.2" />
        <line x1="0" y1="48" x2="252" y2="48" stroke="#333338" stroke-width="1.2" />
        <line x1="0" y1="60" x2="252" y2="60" stroke="#333338" stroke-width="1.2" />

        <!-- Measure Barlines -->
        <line x1="126" y1="0" x2="126" y2="60" stroke="#52525b" stroke-width="1.5" />

        <!-- Fret Numbers -->
        <text x="25" y="28" font-family="ui-monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
        <text x="55" y="16" font-family="ui-monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
        <text x="85" y="4" font-family="ui-monospace" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">10b</text>

        <text x="155" y="4" font-family="ui-monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
        <text x="185" y="16" font-family="ui-monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
        <text x="215" y="28" font-family="ui-monospace" font-size="12" font-weight="bold" fill="#f97316" text-anchor="middle">~9</text>
      </g>
    </g>

    <!-- Bottom Reel Play Progress Bar -->
    <g transform="translate(30, 456)">
      <rect x="0" y="0" width="300" height="3" fill="#3f3f46" opacity="0.6" />
      <rect x="0" y="0" width="0" height="3" fill="#ef4444" class="anim-progress" />
    </g>

    <!-- Dynamic Island / Top Camera Notch -->
    <rect x="135" y="24" width="90" height="20" rx="10" fill="#000000" />
    <circle cx="205" cy="34" r="4.5" fill="#1e1b4b" />
  </g>
</svg>
