<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="neumorphicOuter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="8" stdDeviation="12" flood-color="#09090b" flood-opacity="0.9" />
      <feDropShadow dx="-6" dy="-6" stdDeviation="10" flood-color="#3f3f46" flood-opacity="0.35" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 54px;
        letter-spacing: 7px;
        fill: url(#accentGrad);
        filter: url(#glow);
      }

      .subtitle-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 16px;
        font-weight: 600;
        fill: #a1a1aa;
        letter-spacing: 1.5px;
      }

      .string-line {
        stroke: #3f3f46;
        stroke-width: 1.2;
        stroke-dasharray: 4 4;
      }

      .note-badge {
        fill: #27272a;
        stroke: #ef4444;
        stroke-width: 1.5;
        rx: 12px;
      }

      /* Animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(249, 115, 22, 0.85)); }
      }

      @keyframes textCycle {
        0%, 3% { opacity: 0; transform: translateY(10px); }
        8%, 20% { opacity: 1; transform: translateY(0); }
        25%, 100% { opacity: 0; transform: translateY(-10px); }
      }

      @keyframes textCycle2 {
        0%, 25% { opacity: 0; transform: translateY(10px); }
        28%, 45% { opacity: 1; transform: translateY(0); }
        50%, 100% { opacity: 0; transform: translateY(-10px); }
      }

      @keyframes textCycle3 {
        0%, 50% { opacity: 0; transform: translateY(10px); }
        53%, 70% { opacity: 1; transform: translateY(0); }
        75%, 100% { opacity: 0; transform: translateY(-10px); }
      }

      @keyframes textCycle4 {
        0%, 75% { opacity: 0; transform: translateY(10px); }
        78%, 95% { opacity: 1; transform: translateY(0); }
        99%, 100% { opacity: 0; transform: translateY(-10px); }
      }

      .animated-title {
        animation: pulseGlow 4s ease-in-out infinite;
      }

      .cycle-1 { animation: textCycle 12s ease-in-out infinite; }
      .cycle-2 { animation: textCycle2 12s ease-in-out infinite; }
      .cycle-3 { animation: textCycle3 12s ease-in-out infinite; }
      .cycle-4 { animation: textCycle4 12s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Neumorphic Card Body -->
  <rect x="25" y="20" width="850" height="240" rx="28" fill="url(#bgGrad)" filter="url(#neumorphicOuter)" stroke="#3f3f46" stroke-width="1" />

  <!-- Inner Display Screen Well -->
  <rect x="45" y="38" width="810" height="204" rx="20" fill="#121214" stroke="#27272a" stroke-width="1.5" />

  <!-- Animated Guitar Strings Background -->
  <g opacity="0.3">
    <line x1="60" y1="65" x2="840" y2="65" class="string-line" />
    <line x1="60" y1="95" x2="840" y2="95" class="string-line" />
    <line x1="60" y1="125" x2="840" y2="125" class="string-line" />
    <line x1="60" y1="155" x2="840" y2="155" class="string-line" />
    <line x1="60" y1="185" x2="840" y2="185" class="string-line" />
    <line x1="60" y1="215" x2="840" y2="215" class="string-line" />
  </g>

  <!-- Animated Logo Icon -->
  <g transform="translate(100, 75)">
    <!-- Soft Neumorphic Circular Icon Hub -->
    <circle cx="45" cy="45" r="42" fill="#202024" stroke="#3f3f46" stroke-width="2" />
    <!-- Guitar Pick / Note Path -->
    <path d="M45 18 C30 20, 20 35, 25 54 C30 72, 45 78, 45 78 C45 78, 60 72, 65 54 C70 35, 60 20, 45 18 Z" fill="url(#accentGrad)" opacity="0.95" />
    <!-- Musical Note inside Pick -->
    <circle cx="40" cy="56" r="5" fill="#ffffff" />
    <circle cx="52" cy="50" r="4.5" fill="#ffffff" />
    <path d="M44 56 L44 32 L56 27 L56 50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M44 38 L56 33" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- App Title -->
  <g transform="translate(230, 115)" class="animated-title">
    <text x="0" y="0" class="title-text">TAB2SHARE</text>
  </g>

  <!-- Tagline Pill -->
  <g transform="translate(230, 130)">
    <rect x="0" y="0" width="220" height="22" rx="11" fill="#27272a" stroke="#ef4444" stroke-width="0.8" opacity="0.85" />
    <text x="110" y="15" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#f87171" letter-spacing="1.2px">NEUMORPHIC TAB SUITE</text>
  </g>

  <!-- Dynamic Animated Carousel Subtitle -->
  <g transform="translate(230, 195)">
    <g class="cycle-1">
      <text x="0" y="0" class="subtitle-text">🎸 Next-Gen Neumorphic Guitar Tab &amp; Notation Editor</text>
    </g>
    <g class="cycle-2">
      <text x="0" y="0" class="subtitle-text">🎬 9:16 Instagram Reel &amp; TikTok Auto-Split Exporter</text>
    </g>
    <g class="cycle-3">
      <text x="0" y="0" class="subtitle-text">🎡 30-Chord Interactive Radial Wheel &amp; Visual Fretboard</text>
    </g>
    <g class="cycle-4">
      <text x="0" y="0" class="subtitle-text">🌊 Butter-Smooth MX Master 3S 120Hz Side-Wheel Scrolling</text>
    </g>
  </g>
</svg>
