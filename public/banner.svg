<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Soft Neumorphic Raised Shadows (Light from Top-Left: -135deg) -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="10" stdDeviation="14" flood-color="#08080a" flood-opacity="0.85" />
      <feDropShadow dx="-6" dy="-6" stdDeviation="10" flood-color="#383842" flood-opacity="0.28" />
    </filter>

    <filter id="dialShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="6" stdDeviation="8" flood-color="#0a0a0d" flood-opacity="0.8" />
      <feDropShadow dx="-4" dy="-4" stdDeviation="6" flood-color="#3a3a44" flood-opacity="0.3" />
    </filter>

    <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="4" flood-color="#0a0a0c" flood-opacity="0.75" />
      <feDropShadow dx="-2" dy="-2" stdDeviation="3" flood-color="#383840" flood-opacity="0.25" />
    </filter>

    <!-- Inset Well Shadow for Sunken Dial Ring -->
    <filter id="insetRing" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="3" dy="3" />
      <feGaussianBlur stdDeviation="4" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="#060608" flood-opacity="0.9" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>

    <!-- Red Guitar Pick Gradient & Shadows -->
    <linearGradient id="pickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <filter id="pickShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#050507" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3" />
    </filter>


    <style>
      .brand-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        font-weight: 900;
        font-size: 40px;
        letter-spacing: 6px;
        fill: #f4f4f5;
      }

      .brand-subtitle {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        fill: #8e8e98;
        letter-spacing: 0.4px;
      }

      .chip-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #d4d4d8;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <!-- Outer Neumorphic Card Faceplate -->
  <rect x="18" y="15" width="864" height="210" rx="22" fill="#222226" stroke="#2d2d34" stroke-width="1.2" filter="url(#cardShadow)" />

  <!-- Subtle Inset Bezel Groove -->
  <rect x="28" y="25" width="844" height="190" rx="16" fill="none" stroke="#1a1a1d" stroke-width="1.5" opacity="0.6" />

  <!-- Left Neumorphic Emblem / Dial Hub -->
  <g transform="translate(112, 120)">
    <!-- Raised Outer Dial -->
    <circle cx="0" cy="0" r="54" fill="#222226" stroke="#2e2e36" stroke-width="1.2" filter="url(#dialShadow)" />

    <!-- Inset Inner Recess Ring -->
    <circle cx="0" cy="0" r="42" fill="#18181b" stroke="#24242a" stroke-width="1" filter="url(#insetRing)" />

    <!-- Red Guitar Pick Icon with Subtle Neumorphic Depth -->
    <g filter="url(#pickShadow)">
      <path d="M0 -25 C16 -25, 25 -14, 22 2 C19 14, 8 23, 2 26 C1 26.8, -1 26.8, -2 26 C-8 23, -19 14, -22 2 C-25 -14, -16 -25, 0 -25 Z"
            fill="url(#pickGrad)" stroke="#fca5a5" stroke-width="0.8" stroke-opacity="0.35" />
      <!-- Subtle tactile highlight along top edge -->
      <path d="M-14 -19 C-5 -23, 5 -23, 14 -19"
            stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.4" fill="none" />
    </g>
  </g>

  <!-- Vertical Subtle Divider between Hub & Content -->
  <line x1="195" y1="45" x2="195" y2="195" stroke="#2a2a30" stroke-width="1" opacity="0.7" />

  <!-- Main Content Cluster -->
  <g transform="translate(225, 0)">
    <!-- Top Row: Brand Title -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" class="brand-title">TAB<tspan fill="#ef4444">2</tspan>SHARE</text>
    </g>

    <!-- Middle Row: Subtitle -->
    <g transform="translate(0, 114)">
      <text x="0" y="0" class="brand-subtitle">Modern Neumorphic Desktop Guitar Tab Editor &amp; Transparent Video Exporter</text>
    </g>

    <!-- Bottom Row: Tactile Feature Chips -->
    <g transform="translate(0, 145)">
      <!-- Chip 1: Reel Exporter -->
      <g transform="translate(0, 0)">
        <rect width="186" height="30" rx="8" fill="#222226" stroke="#2d2d34" stroke-width="1" filter="url(#chipShadow)" />
        <circle cx="14" cy="15" r="2.5" fill="#ef4444" />
        <text x="25" y="19" class="chip-text">9:16 Reel Auto-Split</text>
      </g>

      <!-- Chip 2: Radial Chord Hub -->
      <g transform="translate(200, 0)">
        <rect width="176" height="30" rx="8" fill="#222226" stroke="#2d2d34" stroke-width="1" filter="url(#chipShadow)" />
        <circle cx="14" cy="15" r="2.5" fill="#ef4444" />
        <text x="25" y="19" class="chip-text">Radial Chord Hub</text>
      </g>

      <!-- Chip 3: Smooth Scroll -->
      <g transform="translate(390, 0)">
        <rect width="170" height="30" rx="8" fill="#222226" stroke="#2d2d34" stroke-width="1" filter="url(#chipShadow)" />
        <circle cx="14" cy="15" r="2.5" fill="#ef4444" />
        <text x="25" y="19" class="chip-text">120Hz Soft Scroll</text>
      </g>
    </g>
  </g>
</svg>
